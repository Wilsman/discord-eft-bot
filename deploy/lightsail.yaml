AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  NerdBot Discord bot on a single Lightsail nano instance (512 MB, USD 5/month flat incl. IPv4).
  Outbound-only workload, so no load balancer, static IP or open web ports.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: discord gateway ws (outbound) + json.tarkov.dev polling -> python proc under systemd
    must:
      - bot token never in template/params; copied to /opt/nerdbot/app/.env over ssh after create
      - ipv4 required (discord has no ipv6), so no ipv6-only bundle
    ref: deploy/README.md

Parameters:
  InstanceName:
    Type: String
    Default: nerdbot
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
  KeyPairName:
    Type: String
    Description: Existing Lightsail key pair in this region used for SSH.
  SshCidr:
    Type: String
    Description: CIDR allowed to SSH in, e.g. your home IP as 203.0.113.7/32.
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$"
  Branch:
    Type: String
    Default: main
    Description: Git branch of github.com/Wilsman/discord-eft-bot to deploy.

Resources:
  BotInstance:
    Type: AWS::Lightsail::Instance
    Metadata:
      com.aws.cloudformation.Context:
        why: nano_3_0 is cheapest bundle w/ ipv4; bot peaks ~190 MB RSS. debian_13 lean base + python 3.13
        must:
          - bundle must include ipv4 (discord gateway)
          - only port 22 open; bot needs no inbound
        mutable: review-required
        mutability:
          BundleId: must-never-change
          BlueprintId: must-never-change
    Properties:
      InstanceName: !Ref InstanceName
      BlueprintId: debian_13
      BundleId: nano_3_0
      KeyPairName: !Ref KeyPairName
      Networking:
        Ports:
          - FromPort: 22
            ToPort: 22
            Protocol: tcp
            Cidrs:
              - !Ref SshCidr
            CidrListAliases:
              - lightsail-connect
      UserData: !Sub |
        #!/bin/bash
        set -euxo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends python3 python3-venv git unattended-upgrades
        # 1 GB swap so a data refresh can never OOM the 512 MB box
        if [ ! -f /swapfile ]; then
          fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
        fi
        id nerdbot || useradd --system --create-home --home-dir /opt/nerdbot --shell /usr/sbin/nologin nerdbot
        if [ ! -d /opt/nerdbot/app ]; then
          sudo -u nerdbot git clone --branch ${Branch} https://github.com/Wilsman/discord-eft-bot.git /opt/nerdbot/app
        fi
        sudo -u nerdbot python3 -m venv /opt/nerdbot/venv
        sudo -u nerdbot /opt/nerdbot/venv/bin/pip install --no-cache-dir -r /opt/nerdbot/app/requirements.txt
        install -m 644 /opt/nerdbot/app/deploy/nerdbot.service /etc/systemd/system/nerdbot.service
        systemctl daemon-reload
        # Starts on its own once .env exists (ConditionPathExists in the unit)
        systemctl enable nerdbot.service
        touch /opt/nerdbot/.bootstrapped
      Tags:
        - Key: app
          Value: nerdbot

Outputs:
  InstanceName:
    Value: !Ref BotInstance
  PublicIp:
    Description: Changes if the instance is stopped and started.
    Value: !GetAtt BotInstance.PublicIpAddress
  SshUser:
    Value: !GetAtt BotInstance.UserName
